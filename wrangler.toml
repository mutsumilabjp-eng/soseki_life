name = "natsume"
account_id = "8cd7ecdaf8eb44bf0d12bd406fa9d0dd"
main = "src/index.js"
compatibility_date = "2026-09-10"
workers_dev = true

# お問い合わせフォーム（/privacy/ → POST /api/contact）に必要なCloudflare Secret（値はコード・Gitに置かない）:
#   npx wrangler secret put RESEND_API_KEY    … Resendの送信用APIキー
#   npx wrangler secret put CONTACT_TO_EMAIL  … 通知の宛先メールアドレス（ページにもコードにも表示しない）
# 任意の環境変数（機密ではないので[vars]に書いてよい）:
#   CONTACT_FROM_EMAIL … 差出人表示。未設定なら "夏目｜soseki_life <onboarding@resend.dev>"

[[d1_databases]]
binding = "DB"
database_name = "natsume-free-sheet-events"
database_id = "0e39f606-3a5e-4743-a45d-654435f88a8c"
migrations_dir = "migrations"

[assets]
directory = "./public"
binding = "ASSETS"
html_handling = "auto-trailing-slash"
not_found_handling = "404-page"
# Only HTML documents and the event endpoint invoke the Worker. CSS, JavaScript,
# and the WebP are served directly from Assets to preserve the free-tier budget.
run_worker_first = ["/", "/api/*", "/shigoto-seiri", "/shigoto-seiri/", "/privacy", "/privacy/"]
