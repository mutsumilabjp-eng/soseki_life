name: Check ImgBB Secret Presence
on:
  push:
    paths:
      - ".github/workflows/check-imgbb-secret-chatgpt.yml"
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check presence only
        env:
          IMGBB_API_KEY: ${{ secrets.IMGBB_API_KEY }}
        run: |
          if [ -n "$IMGBB_API_KEY" ]; then
            echo "IMGBB_SECRET_PRESENT=true"
          else
            echo "IMGBB_SECRET_PRESENT=false"
            exit 2
          fi
