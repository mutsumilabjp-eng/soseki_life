name = "natsume"
account_id = "8cd7ecdaf8eb44bf0d12bd406fa9d0dd"
main = "src/index.js"
compatibility_date = "2026-09-10"
workers_dev = true

[[d1_databases]]
binding = "DB"
database_name = "natsume-free-sheet-events"
database_id = "0e39f606-3a5e-4743-a45d-654435f88a8c"
migrations_dir = "migrations"

[assets]
directory = "./public"
binding = "ASSETS"
html_handling = "auto-trailing-slash"
not_found_handling = "404-page"
# Only HTML documents and the event endpoint invoke the Worker. CSS, JavaScript,
# and the WebP are served directly from Assets to preserve the free-tier budget.
run_worker_first = ["/", "/api/*", "/shigoto-seiri", "/shigoto-seiri/", "/privacy", "/privacy/"]
